[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    camera: tests that require camera
    api: tests that require API backend
    slow: tests that take a long time
    integration: integration tests
addopts = 
    -v
    --strict-markers

[coverage:run]
omit =
    main.py
    camera/*
    detection/*
    recognition/*
    video/*
    api/*
    scripts/*
    tests/*

[coverage:report]
omit =
    main.py
    camera/*
    detection/*
    recognition/*
    video/*
    api/*
    scripts/*
    tests/*
