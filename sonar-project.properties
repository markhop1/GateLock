sonar.projectKey=GateLock
sonar.projectName=GateLock
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src

sonar.test.inclusions=backend/src/**/*.test.ts,backend/src/**/*.spec.ts,backend/src/**/__tests__/**/*.ts,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,frontend/src/**/__tests__/**/*.ts,frontend/src/**/__tests__/**/*.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/uploads/**,raspberry-pi/**,raspberry-pi-service/**,spikes/**,backend/src/routes/**,backend/src/models/**,backend/src/config/database.ts,backend/src/controllers/nuki.controller.ts,frontend/src/pages/AddPersonPage.tsx,frontend/src/services/nuki.service.ts,frontend/src/store/**,frontend/src/types/error.ts

# Exclude test/bootstrap files from coverage expectations.
sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,frontend/src/test/**,frontend/src/main.tsx,frontend/src/App.tsx,backend/src/index.ts,backend/src/routes/**,backend/src/models/**,backend/src/config/database.ts,backend/src/controllers/nuki.controller.ts,frontend/src/pages/AddPersonPage.tsx,frontend/src/services/nuki.service.ts,frontend/src/store/**,frontend/src/types/error.ts

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info