sonar.projectKey=GateLock
sonar.projectName=GateLock
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src

sonar.test.inclusions=backend/src/**/*.{test,spec}.ts,backend/src/**/__tests__/**/*.ts,frontend/src/**/*.{test,spec}.{ts,tsx},frontend/src/**/__tests__/**/*.{ts,tsx}

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/uploads/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info